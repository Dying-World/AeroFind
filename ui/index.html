<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AeroFind 2016</title>
  <style>
    :root {
      --bg-1: #edf5fb;
      --bg-2: #dfeaf5;
      --header-1: #e7f0f8;
      --header-2: #d1dde8;
      --ink: #1d2d3b;
      --muted: #4e6679;
      --line: #9fb4c4;
      --blue: #3d7ac1;
      --panel: #f9fbfd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Tahoma, sans-serif;
      color: var(--ink);
      background: linear-gradient(#f5f9fd, #dfeaf2 18%, #d7e3ec 100%);
    }
    .chrome {
      width: min(980px, calc(100% - 28px));
      margin: 40px auto 0;
      border: 1px solid var(--line);
      background: linear-gradient(#f4f8fc, #dfeaf5);
      box-shadow: inset 0 1px #fff, 0 2px 0 rgba(12, 45, 68, 0.15);
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(var(--header-1), var(--header-2));
    }
    .logo {
      font-size: 12px;
      letter-spacing: 1px;
      font-weight: bold;
      color: var(--blue);
      text-transform: uppercase;
    }
    .search-wrap {
      flex: 1;
      display: flex;
      gap: 8px;
      align-items: center;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: inset 0 1px 2px rgba(0,0,0,.08);
      padding: 7px 10px;
      max-width: 690px;
    }
    .search-wrap input {
      flex: 1;
      border: 0;
      outline: none;
      font-size: 14px;
      background: transparent;
      color: var(--ink);
    }
    .search-wrap select, .toolbar button {
      border: 1px solid var(--line);
      background: linear-gradient(#fff, #e7eff7);
      color: var(--ink);
      padding: 6px 10px;
      font-size: 12px;
    }
    .content {
      padding: 18px;
    }
    .hero {
      background: linear-gradient(#fdfefe, #edf4fa);
      border: 1px solid var(--line);
      padding: 22px 20px 14px;
    }
    .hero h1 {
      margin: 0 0 10px;
      font-size: 42px;
      font-weight: normal;
      letter-spacing: -1px;
      color: #214c75;
    }
    .hero p {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 18px;
    }
    .card {
      min-height: 150px;
      text-decoration: none;
      color: var(--ink);
      display: block;
      background: linear-gradient(#ffffff, #edf4fb);
      border: 1px solid var(--line);
      padding: 16px;
      box-shadow: inset 0 1px #fff;
    }
    .card small {
      display: block;
      color: var(--blue);
      font-size: 11px;
      letter-spacing: 1px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 24px;
      font-weight: normal;
      color: #1e517d;
    }
    .card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
    }
    @media (max-width: 760px) {
      .chrome { width: calc(100% - 18px); margin-top: 12px; }
      .toolbar { flex-wrap: wrap; }
      .search-wrap { max-width: none; width: 100%; }
      .cards { grid-template-columns: 1fr; }
      .hero h1 { font-size: 32px; }
    }
  </style>
</head>
<body>
  <main class="chrome">
    <div class="toolbar">
      <div class="logo">AeroFind</div>
      <div class="search-wrap">
        <input id="q" type="text" placeholder="Search the web or type a site" autocomplete="off">
        <select id="engine" aria-label="Search engine">
          <option value="https://www.google.com/search?q=">Google</option>
          <option value="https://www.bing.com/search?q=">Bing</option>
        </select>
        <button id="go" type="button">Search</button>
      </div>
    </div>

    <div class="content">
      <div class="hero">
        <h1>Welcome to the web.</h1>
        <p>A lighter browser shell with a classic 2016-era search experience and fast Chromium rendering.</p>
      </div>

      <div class="cards">
        <a class="card" href="https://www.google.com/maps?q=%D0%B0%D0%B2%D1%96%D0%B9%D0%BD%D0%BD%D0%B8%D0%B9%20%D0%BA%D0%B0%D1%80%D1%82%D0%B0">
          <small>status</small>
          <h2>Air map</h2>
          <p>Emergency safety view and alerts.</p>
        </a>
        <a class="card" href="https://github.com/">
          <small>code</small>
          <h2>GitHub</h2>
          <p>Open repositories and projects fast.</p>
        </a>
        <a class="card" href="https://www.wikipedia.org/">
          <small>read</small>
          <h2>Wikipedia</h2>
          <p>Read and research with a clean layout.</p>
        </a>
      </div>
    </div>
  </main>

  <script>
    const input = document.getElementById('q');
    const engine = document.getElementById('engine');
    const go = document.getElementById('go');

    const runSearch = () => {
      const query = input.value.trim();
      if (!query) return;
      window.location.href = engine.value + encodeURIComponent(query);
    };

    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') runSearch();
    });
    go.addEventListener('click', runSearch);
  </script>
</body>
</html>
