<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AeroFind Downloads</title>
  <style>
    :root {
      --bg: #edf5fb;
      --panel: #fff;
      --line: #a4bfd5;
      --ink: #1f365b;
      --muted: #516d86;
      --accent: #2d6ea8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; font-family: Tahoma, Arial, sans-serif; background: linear-gradient(#f7fbff, #dfeaf4); color: var(--ink); }
    .page { max-width: 980px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); box-shadow: inset 0 1px #fff, 3px 4px 0 rgba(31, 62, 89, 0.12); }
    .head { padding: 18px 22px; border-bottom: 1px solid var(--line); background: linear-gradient(#f8fbff, #eaf2f9); }
    .head h1 { margin: 0; font-size: 28px; }
    .body { padding: 18px 22px 26px; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { border-bottom: 1px solid #e2edf7; padding: 10px 0; color: var(--muted); }
    a { color: var(--accent); text-decoration: none; word-break: break-word; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="page">
    <div class="head"><h1>Downloads</h1></div>
    <div class="body">
      <ul id="items"></ul>
    </div>
  </main>

  <script>
    const items = document.getElementById('items');
    const downloads = JSON.parse(localStorage.getItem('aerofind.downloads') || '[]');
    if (!downloads.length) {
      items.innerHTML = '<li>No downloads yet.</li>';
    } else {
      downloads.forEach((entry) => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = entry;
        a.textContent = entry;
        li.appendChild(a);
        items.appendChild(li);
      });
    }
  </script>
</body>
</html>
