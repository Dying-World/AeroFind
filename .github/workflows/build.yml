name: Build AeroFind

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Install NuGet
        uses: NuGet/setup-nuget@v4

      - name: Download WebView2 SDK
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.2903.40 -OutputDirectory "$env:GITHUB_WORKSPACE/.deps"

      - name: Configure
        shell: pwsh
        run: |
          $sdk = Get-ChildItem -Path "$env:GITHUB_WORKSPACE/.deps" -Directory -Filter 'Microsoft.Web.WebView2.*' | Select-Object -First 1
          if (-not $sdk) { throw 'WebView2 SDK package was not downloaded.' }
          Write-Host "Using WebView2 SDK: $($sdk.FullName)"
          cmake -S . -B build -A x64 -DWEBVIEW2_ROOT="$($sdk.FullName)"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel -- /v:minimal

      - name: Show build diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host 'Build failed. CMake files:'
          Get-ChildItem -Path build -Recurse -Include '*.log','*.tlog' -ErrorAction SilentlyContinue | Select-Object -First 20 -ExpandProperty FullName
          cmake --build build --config Release --verbose

      - name: Package
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'build/Release'
          $required = @('AeroFind.exe', 'WebView2Loader.dll', 'ui/index.html', 'ui/settings.html')
          foreach ($relative in $required) {
            $path = Join-Path $root $relative
            if (-not (Test-Path $path)) { throw "Missing release file: $relative" }
          }
          $zip = Join-Path $env:GITHUB_WORKSPACE 'AeroFind-windows-x64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          $items = @(
            (Join-Path $root 'AeroFind.exe'),
            (Join-Path $root 'WebView2Loader.dll'),
            (Join-Path $root 'ui')
          )
          Compress-Archive -Path $items -DestinationPath $zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroFind-windows-x64
          path: AeroFind-windows-x64.zip

      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AeroFind-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}